[package]
name = "sigil-circuits"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
mopro-ffi = { version = "0.3.5", features = ["uniffi"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.94"
thiserror = "2.0"

noir_rs = { package = "noir", git = "https://github.com/zkmopro/noir-rs", features = [
    "barretenberg",
], rev = "0e4fdc9fc0cb383fcada7d3864dd2424f137316b" }

bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "v1.0.0-beta.19" }

num-bigint = "0.4"

[dev-dependencies]
serial_test = "3.0.0"

[build-dependencies]
mopro-ffi = { version = "0.3.5", features = ["build"] }

# mopro-ffi 0.3.5 pins uniffi =0.29.0. The bindgen tool must match.
# uniffi-bindgen-react-native downgraded to 0.29.0-0 to align with the Rust runtime.
