[package]
name = "zkpassport-circuits"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
mopro-ffi = { version = "0.3.5", features = ["uniffi"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.94"
thiserror = "2.0"

noir_rs = { package = "noir", git = "https://github.com/zkmopro/noir-rs", features = [
    "barretenberg",
    "android-compat",
], branch = "v1.0.0-beta.8-3" }

bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir.git", rev = "b33131574388d836341cea9b6380f3b1a8493eb8" }

[dev-dependencies]
serial_test = "3.0.0"

[build-dependencies]
mopro-ffi = { version = "0.3.5", features = ["build"] }

# Force uniffi to 0.29.3 so the contract version (30) matches uniffi-bindgen-react-native 0.29.3-1.
# mopro-ffi 0.3.5 pins uniffi =0.29.0 but 0.29.3 is API-compatible.
[patch.crates-io]
uniffi = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.29.3" }
uniffi_core = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.29.3" }
uniffi_macros = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.29.3" }
uniffi_bindgen = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.29.3" }
uniffi_meta = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.29.3" }
uniffi_udl = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.29.3" }
